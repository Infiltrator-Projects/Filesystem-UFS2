# SPDX-License-Identifier: GPL-3.0-or-later
# Hosted V2 file namespace; firmware release requires freestanding ELF,
# production BOOT validator and genuine OVMF Linux kernel/initramfs tests.
name: Qualify UFS2 Common V2 hosted DEB and native RUN
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils cmake git pkg-config jq libssl-dev libsqlite3-dev dpkg-dev
      - name: Qualify portable package without Linux kernel fallback
        run: |
          set -euo pipefail
          bash standalone/release.sh release
          bash standalone/check-package.sh dist/*.deb --profile portable
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.run' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.ko' | wc -l)" = 0
          mkdir -p "$RUNNER_TEMP/portable"
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/portable"
          test "$(find "$RUNNER_TEMP/portable" -type f | wc -l)" = 2
          bash tests/check_v2_exports.sh "$RUNNER_TEMP/portable/System/Filesystems/UFS2.so"
      - name: Qualify native source-embedded RUN
        run: |
          set -euo pipefail
          installer="$(find dist -maxdepth 1 -name '*.run' -print -quit)"
          bash "$installer" --profile aggressive --system-package-mode --build-only --output "$RUNNER_TEMP/native"
          deb="$(find "$RUNNER_TEMP/native" -maxdepth 1 -name '*.deb' -print -quit)"
          test -s "$deb"
          bash standalone/check-package.sh "$deb" --profile aggressive
          mkdir -p "$RUNNER_TEMP/root"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/root"
          test "$(find "$RUNNER_TEMP/root" -type f | wc -l)" = 2
          bash tests/check_v2_exports.sh "$RUNNER_TEMP/root/System/Filesystems/UFS2.so"
          test "$(find "$RUNNER_TEMP/root" -name '*.ko' | wc -l)" = 0
      - uses: actions/upload-artifact@v4
        with:
          name: UFS2-hosted-only-not-BOOT-qualified
          path: dist/*
          if-no-files-found: error

  # Only a passing source/package qualification may publish. This is a hosted
  # Common V2 release, NOT a BOOT firmware qualification or release.
  publish-hosted:
    needs: qualify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: UFS2-hosted-only-not-BOOT-qualified
          path: dist
      - name: Publish immutable UFS2 hosted-only V2 artifacts after qualification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="v$version"
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.run' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.ko' | wc -l)" = 0
          sha256sum dist/*.deb dist/*.run | sed 's#  dist/#  #' > dist/SHA256SUMS.txt
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            target="$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "REFUSING: immutable $tag belongs to $target, not $GITHUB_SHA" >&2
              exit 1
            fi
          else
            gh release create "$tag" dist/*.deb dist/*.run dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "UFS2 $version — hosted Common V2 only" \
              --notes "Common V2 hosted provider, qualified source, disposable media tests, and portable/native packages. Not BOOT-qualified: no freestanding ELF or OVMF kernel/initramfs validation. No filesystem-specific Linux kernel module."
          fi
          mkdir -p "$RUNNER_TEMP/release-check"
          gh release download "$tag" --dir "$RUNNER_TEMP/release-check"
          diff -qr dist "$RUNNER_TEMP/release-check"
          (cd "$RUNNER_TEMP/release-check" && sha256sum -c SHA256SUMS.txt)
