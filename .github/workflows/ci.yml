name: UFS2 independently built shared object
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ufs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install required native build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev
      - name: Compile UFS2.so with audited authoritative Common
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          test -f build/UFS2.so
          nm -D build/UFS2.so | grep -F infiltrator_filesystem_ufs_v1
      - uses: actions/upload-artifact@v4
        with:
          name: UFS2-so
          path: build/UFS2.so
      - name: Verify exactly one PDF per runtime SO
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          DESTDIR="$stage" cmake --install build
          test "$(find "$stage" -type f | wc -l)" -eq 2
          test -f "$stage/System/Filesystems/UFS2.so"
          test -f "$stage/System/Resources/Documentation/Filesystem-UFS2/UFS.pdf"
          test "$(head -c 5 "$stage/System/Resources/Documentation/Filesystem-UFS2/UFS.pdf")" = '%PDF-'
