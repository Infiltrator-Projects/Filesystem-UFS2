# SPDX-License-Identifier: GPL-3.0-or-later
# Independent freestanding engineering gate; no release or live ESP writes.
name: Qualify UFS2 native freestanding Common V2 ELF
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ufs2-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build and ELF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils cmake git libssl-dev
      - name: Build actual native UFS2 engine in freestanding profile
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --target ufs2-firmware-elf --parallel 2
          test -s build/firmware/UFS2.so
          ! readelf -dW build/firmware/UFS2.so | grep '(NEEDED)'
          nm -D --defined-only build/firmware/UFS2.so | grep -F 'infiltrator_filesystem_api_v2'
          ! nm -u build/firmware/UFS2.so | grep .
      - name: Use unmodified rebuilt BOOT binary validator
        run: |
          set -euo pipefail
          source tests/require-rebuilt-boot.sh
          validator="$IFS_BOOT_VALIDATOR"
          "$validator" build/firmware/UFS2.so
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          DESTDIR="$RUNNER_TEMP/stage" cmake --install build
          module="$RUNNER_TEMP/stage/System/Filesystems/UFS2.so"
          test -s "$module"
          readelf -SW "$module" | grep -F '.infiltrator_boot'
          "$validator" "$module"
          cmp build/UFS2.so "$module"
          echo UFS2_NATIVE_FREESTANDING_AND_HOSTED_ELF_VALIDATOR_PASS
      - name: Boot actual kernel and initramfs through packaged UFS2.so in OVMF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            cpio busybox-static dosfstools gdisk mtools qemu-system-x86 ovmf
          cc -std=c11 -D_GNU_SOURCE -O2 -Wall -Wextra -Wpedantic -Werror \
            fixtures/ufs_mkfs.c -o "$RUNNER_TEMP/ufs2-fixture-writer"
          kernel_package=$(apt-cache depends linux-image-generic |
            awk '/Depends: linux-image-[0-9]/ { image=$2 } END { print image }')
          test -n "$kernel_package"
          release=${kernel_package#linux-image-}
          (cd "$RUNNER_TEMP" && apt-get download "linux-image-unsigned-$release")
          dpkg-deb -x "$RUNNER_TEMP"/linux-image-unsigned-*.deb "$RUNNER_TEMP/kernel"
          kernel="$RUNNER_TEMP/kernel/boot/vmlinuz-$release"
          test -s "$kernel"
          boot="$IFS_BOOT_EFI"
          module="$RUNNER_TEMP/stage/System/Filesystems/UFS2.so"
          bash tests/firmware-ufs2.sh "$boot" "$module" "$kernel" \
            "$RUNNER_TEMP/ufs2-fixture-writer" "$RUNNER_TEMP/ufs2-boot"
          bash tests/firmware-ufs2.sh "$boot" "$module" "$kernel" \
            "$RUNNER_TEMP/ufs2-fixture-writer" "$RUNNER_TEMP/ufs2-corrupt" \
            bad-superblock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ufs2-ovmf-serial
          path: '**/serial.log'
          if-no-files-found: warn
