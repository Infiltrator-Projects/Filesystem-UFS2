# SPDX-License-Identifier: GPL-3.0-or-later
# Independent freestanding engineering gate; no release or live ESP writes.
name: Qualify UFS2 native freestanding Common V2 ELF
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ufs2-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build and ELF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils cmake git libssl-dev
      - name: Build actual native UFS2 engine in freestanding profile
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --target ufs2-firmware-elf --parallel 2
          test -s build/firmware/UFS2.so
          ! readelf -dW build/firmware/UFS2.so | grep '(NEEDED)'
          nm -D --defined-only build/firmware/UFS2.so | grep -F 'infiltrator_filesystem_api_v2'
          ! nm -u build/firmware/UFS2.so | grep .
      - name: Validate native UFS2 shared object, CTest and exact installed carrier
        run: |
          set -euo pipefail
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          DESTDIR="$RUNNER_TEMP/stage" cmake --install build
          module="$RUNNER_TEMP/stage/System/Filesystems/UFS2.so"
          test -s "$module"
          readelf -SW "$module" | grep -F '.infiltrator_boot'
          nm -D --defined-only "$module" | grep -F infiltrator_filesystem_api_v2
          ! nm -D --defined-only "$module" | grep -E 'infiltrator_filesystem_.*_v1'
          cmp "build/UFS2.so" "$module"
          echo UFS2_COMMON_V2_NATIVE_FREESTANDING_CARRIER_PASS
